[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usable-weight-mechanisms"
version = "0.5.0"
description = "Finding Usable Weight Mechanisms with Tiled SVD (Aquin Labs)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Aquin Labs", email = "aquin@aquin.app" },
]
dependencies = [
  "numpy>=1.26",
  "transformers>=4.44",
  "accelerate>=0.33",
  "huggingface_hub>=0.24",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "datasets>=2.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.hatch.build.targets.sdist]
include = [
  "src/atlas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
